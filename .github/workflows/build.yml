name: Build Gulf-War
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android tools
        run: sdkmanager 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35' 'cmdline-tools;latest' 'cmake;3.10.2.4988404' 'ndk;28.1.13356709'
      - name: Install Godot and export templates
        env:
          GODOT_VERSION: 4.6.3
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import and test
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --script res://tests/smoke.gd
      - name: Export browser edition
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: Gulf-War-browser
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Configure Android debug signing
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          python3 - <<'PY'
          import os
          from pathlib import Path
          config = Path.home() / '.config/godot/editor_settings-4.6.tres'
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' + '\n'.join([
              'export/android/android_sdk_path = "' + os.environ['ANDROID_HOME'] + '"',
              'export/android/java_sdk_path = "' + os.environ['JAVA_HOME'] + '"',
              'export/android/debug_keystore = "/tmp/debug.keystore"',
              'export/android/debug_keystore_user = "androiddebugkey"',
              'export/android/debug_keystore_pass = "android"',
          ]) + '\n')
          PY
      - name: Export Android APK
        run: godot --headless --path . --export-debug Android build/Gulf-War.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gulf-War-Android-APK
          path: build/Gulf-War.apk
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
