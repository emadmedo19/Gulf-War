name: Build Gulf-War
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check Pages availability
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const {data: repo} = await github.rest.repos.get(context.repo);
            core.setOutput('enabled', repo.has_pages ? 'true' : 'false');
            if (!repo.has_pages) {
              await core.summary.addHeading('Browser publishing needs GitHub Pages')
                .addRaw('Android and browser builds still run. Enable Settings → Pages → Source: GitHub Actions, then run this workflow again.')
                .addLink('Open Pages settings', 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/settings/pages')
                .write();
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android tools
        run: sdkmanager 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35' 'cmdline-tools;latest'
      - name: Install Godot and export templates
        env:
          GODOT_VERSION: 4.6.3
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install /tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Verify artwork bytes
        run: python3 tests/asset_integrity.py
      - name: Import and test
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --script res://tests/export_assets.gd
          godot --headless --path . --script res://tests/smoke.gd
          godot --headless --path . --script res://tests/action.gd
          python3 tests/network_test.py
      - name: Export browser edition
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
          cp tests/export_assets.gd "$RUNNER_TEMP/check-export.gd"
          godot --headless --main-pack build/web/index.pck --script "$RUNNER_TEMP/check-export.gd"
      - uses: actions/upload-artifact@v4
        with:
          name: Gulf-War-browser
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Configure Android debug signing
        run: |
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          python3 - <<'PY'
          import os
          from pathlib import Path
          config = Path.home() / '.config/godot/editor_settings-4.6.tres'
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' + '\n'.join([
              'export/android/android_sdk_path = "' + os.environ['ANDROID_HOME'] + '"',
              'export/android/java_sdk_path = "' + os.environ['JAVA_HOME'] + '"',
              'export/android/debug_keystore = "/tmp/debug.keystore"',
              'export/android/debug_keystore_user = "androiddebugkey"',
              'export/android/debug_keystore_pass = "android"',
          ]) + '\n')
          PY
      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug Android build/Gulf-War.apk
          python3 tests/apk_resources.py build/Gulf-War.apk "$RUNNER_TEMP/Gulf-War-resources.zip"
          godot --headless --main-pack "$RUNNER_TEMP/Gulf-War-resources.zip" --script "$RUNNER_TEMP/check-export.gd"
      - uses: actions/upload-artifact@v4
        with:
          name: Gulf-War-Android-APK
          path: build/Gulf-War.apk
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
